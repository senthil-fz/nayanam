packages:
  - apps/*
  - packages/*

# Expo + React Native require a flat (hoisted) node_modules layout — pnpm's
# default isolated layout causes "unmet peer" errors and React duplication.
# See: https://docs.expo.dev/guides/monorepos/#pnpm
nodeLinker: hoisted

catalog:
  '@tanstack/react-query': ^5.100.10
  '@vitest/coverage-v8': ^3.2.4
  react: ^19.2.6
  react-dom: ^19.2.6
  typescript: ^6.0.3
  vite-tsconfig-paths: ^5.1.4
  vitest: ^4.1.0
  zod: ^4.4.3
  zustand: ^5.0.12

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - core-js
  - esbuild
  - prisma
  - protobufjs
  - sharp

overrides:
  '@hono/node-server@<1.19.13': '>=1.19.13'
  '@protobufjs/utf8@<=1.1.0': '>=1.1.1'
  fast-uri@<=3.1.0: '>=3.1.1'
  fast-uri@<=3.1.1: '>=3.1.2'
  fast-xml-builder@<=1.1.6: '>=1.1.7'
  fast-xml-builder@=1.1.5: '>=1.1.6'
  hono@<4.12.16: '>=4.12.16'
  hono@<4.12.18: '>=4.12.18'
  nodemailer@<8.0.4: '>=8.0.4'
  nodemailer@<=8.0.4: '>=8.0.5'
  postcss@<8.5.10: '>=8.5.10'
  protobufjs@<=7.5.5: '>=7.5.6'
