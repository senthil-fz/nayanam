databaseChangeLog:
  - changeSet:
      id: 20260424-003-phase-3-transfers
      author: nayanam
      comment: Phase 3 — transfers table (precedes transactions so transactions.transfer_id can FK here).
      changes:
        - createTable:
            tableName: transfers
            columns:
              - column: { name: id, type: VARCHAR(26), constraints: { primaryKey: true, nullable: false } }
              - column:
                  name: household_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfers_household
                    references: households(id)
                    deleteCascade: false
              - column:
                  name: source_account_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfers_source_account
                    references: accounts(id)
                    deleteCascade: false
              - column:
                  name: destination_account_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfers_destination_account
                    references: accounts(id)
                    deleteCascade: false
              - column: { name: amount_minor, type: BIGINT, constraints: { nullable: false } }
              - column: { name: currency_code, type: CHAR(3), constraints: { nullable: false } }
              - column: { name: occurred_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: note, type: TEXT }
              - column: { name: deleted_at, type: TIMESTAMPTZ }
              - column:
                  name: created_by
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfers_created_by
                    references: users(id)
              - column:
                  name: updated_by
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transfers_updated_by
                    references: users(id)
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
        - sql:
            sql: >
              ALTER TABLE transfers ADD CONSTRAINT ck_transfers_distinct_accounts
              CHECK (source_account_id <> destination_account_id);
        - sql:
            sql: >
              ALTER TABLE transfers ADD CONSTRAINT ck_transfers_amount_positive
              CHECK (amount_minor > 0);
        - createIndex:
            tableName: transfers
            indexName: idx_transfers_household_occurred
            columns:
              - column: { name: household_id }
              - column: { name: occurred_at, descending: true }
              - column: { name: id, descending: true }
        - createIndex:
            tableName: transfers
            indexName: idx_transfers_household_source
            columns:
              - column: { name: household_id }
              - column: { name: source_account_id }
        - createIndex:
            tableName: transfers
            indexName: idx_transfers_household_destination
            columns:
              - column: { name: household_id }
              - column: { name: destination_account_id }
      rollback:
        - dropTable:
            tableName: transfers
