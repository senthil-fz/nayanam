databaseChangeLog:
  - changeSet:
      id: 20260501-004-001-bill-payments-updated-by
      author: backend-nest
      preConditions:
        - onFail: MARK_RAN
        - columnNotExists:
            tableName: bill_payments
            columnName: updated_by
      changes:
        - addColumn:
            tableName: bill_payments
            columns:
              - column:
                  name: updated_by
                  type: VARCHAR(30)
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: bill_payments
            columnName: updated_by

