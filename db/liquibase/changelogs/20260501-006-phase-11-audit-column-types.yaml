databaseChangeLog:
  - changeSet:
      id: 20260501-006-001-bill-payments-updated-by-type
      author: backend-nest
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "character varying(30)"
            sql: >
              SELECT data_type || '(' || character_maximum_length || ')'
              FROM information_schema.columns
              WHERE table_name = 'bill_payments'
                AND column_name = 'updated_by'
      changes:
        - modifyDataType:
            tableName: bill_payments
            columnName: updated_by
            columnDataType: VARCHAR(26)
      rollback:
        - modifyDataType:
            tableName: bill_payments
            columnName: updated_by
            columnDataType: VARCHAR(30)

