databaseChangeLog:
  - changeSet:
      id: 20260424-003-phase-3-categories
      author: nayanam
      comment: Phase 3 — categories table (system + household), partial uniques, seeded system defaults.
      changes:
        - createTable:
            tableName: categories
            columns:
              - column: { name: id, type: VARCHAR(26), constraints: { primaryKey: true, nullable: false } }
              - column:
                  name: household_id
                  type: VARCHAR(26)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_categories_household
                    references: households(id)
                    deleteCascade: true
              - column: { name: key, type: TEXT, constraints: { nullable: false } }
              - column: { name: label, type: TEXT, constraints: { nullable: false } }
              - column: { name: type, type: TEXT, constraints: { nullable: false } }
              - column: { name: icon_token, type: TEXT, defaultValue: 'tag', constraints: { nullable: false } }
              - column: { name: color_token, type: TEXT, defaultValue: 'graphite', constraints: { nullable: false } }
              - column: { name: display_order, type: INTEGER, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: archived_at, type: TIMESTAMPTZ }
              - column: { name: deleted_at, type: TIMESTAMPTZ }
              - column:
                  name: created_by
                  type: VARCHAR(26)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_categories_created_by
                    references: users(id)
              - column:
                  name: updated_by
                  type: VARCHAR(26)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_categories_updated_by
                    references: users(id)
              - column: { name: created_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
        - sql:
            sql: >
              ALTER TABLE categories ADD CONSTRAINT ck_categories_type
              CHECK (type IN ('INCOME','EXPENSE','TRANSFER'));
        - sql:
            sql: >
              ALTER TABLE categories ADD CONSTRAINT ck_categories_key
              CHECK (char_length(key) BETWEEN 1 AND 48 AND key ~ '^[a-z0-9_]+$');
        - sql:
            sql: >
              ALTER TABLE categories ADD CONSTRAINT ck_categories_label
              CHECK (char_length(label) BETWEEN 1 AND 40);
        - sql:
            sql: >
              CREATE UNIQUE INDEX categories_system_key_uq
              ON categories (key)
              WHERE household_id IS NULL AND deleted_at IS NULL;
        - sql:
            sql: >
              CREATE UNIQUE INDEX categories_household_key_uq
              ON categories (household_id, key)
              WHERE household_id IS NOT NULL AND deleted_at IS NULL;
        - createIndex:
            tableName: categories
            indexName: idx_categories_household_order
            columns:
              - column: { name: household_id }
              - column: { name: display_order }
        - createIndex:
            tableName: categories
            indexName: idx_categories_household_type_archived
            columns:
              - column: { name: household_id }
              - column: { name: type }
              - column: { name: archived_at }
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS categories_system_key_uq;
        - sql:
            sql: DROP INDEX IF EXISTS categories_household_key_uq;
        - dropTable:
            tableName: categories

