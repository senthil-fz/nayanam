openapi: 3.1.0
info:
  title: Nayanam API
  version: 0.1.0
  description: |
    Expense manager REST API. Source of truth for all request/response shapes.
    Consumed by the web app and the mobile (Expo) app via generated TypeScript clients.
  contact:
    name: Nayanam maintainers
    url: https://github.com/nayanam
  license:
    name: UNLICENSED
    url: https://nayanam.app/license
servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Service liveness check
      tags: [meta]
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /auth/otp/request:
    post:
      operationId: authOtpRequest
      summary: Request an OTP code for the given email
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequestBody' }
      responses:
        '200':
          description: OTP sent (always — email existence is not leaked)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestResult' }
        '429': { $ref: '#/components/responses/Error' }

  /auth/otp/verify:
    post:
      operationId: authOtpVerify
      summary: Exchange an OTP for JWTs
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyBody' }
      responses:
        '200':
          description: Token pair + user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/Error' }

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Rotate refresh token, issue a new token pair
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshBody' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the current session
      tags: [auth]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Error' }

  /me:
    get:
      operationId: getMe
      summary: Current user + household memberships
      tags: [me]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }

  /me/push-tokens:
    post:
      operationId: registerPushToken
      summary: Register a device push token
      tags: [me]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenCreate' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushToken' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /me/push-tokens/{id}:
    delete:
      operationId: deletePushToken
      summary: Remove a device push token
      tags: [me]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /households:
    get:
      operationId: listHouseholds
      summary: Households the current user is a member of
      tags: [households]
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HouseholdSummary' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createHousehold
      summary: Create a household; caller becomes OWNER
      tags: [households]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /households/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getHousehold
      summary: Fetch one household by id
      tags: [households]
      responses:
        '200':
          description: One household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateHousehold
      summary: Update a household's mutable fields
      tags: [households]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /households/{id}/members:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: listHouseholdMembers
      summary: List members of a household
      tags: [households]
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HouseholdMember' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /households/{id}/invites:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: listHouseholdInvites
      summary: List pending household invites
      tags: [households]
      responses:
        '200':
          description: Pending invites
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HouseholdInvite' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createHouseholdInvite
      summary: Invite a user to a household
      tags: [households]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdInviteCreate' }
      responses:
        '201':
          description: Invite created; token returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdInviteWithToken' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /households/{id}/invites/{inviteId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: inviteId
        required: true
        schema: { type: string }
    delete:
      operationId: revokeHouseholdInvite
      summary: Revoke a pending household invite
      tags: [households]
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /accounts:
    get:
      operationId: listAccounts
      summary: List accounts in the current household
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: When true, archived accounts are included in the result.
      responses:
        '200':
          description: Accounts page, ordered by displayOrder ASC, createdAt ASC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountsPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAccount
      summary: Create an account in the current household
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /accounts/summary:
    get:
      operationId: getAccountsSummary
      summary: Per-currency totals across active accounts
      description: Excludes archived and deleted accounts. No FX conversion — one bucket per currency.
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountsSummaryResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /accounts/balance-history-all:
    get:
      operationId: getAccountsBalanceHistoryAll
      summary: Household-wide daily balance history across all active accounts
      description: |
        Aggregates daily balance points across every non-archived, non-deleted
        account in the household, bucketed per currency. Bucket key is
        `"YYYY-MM-DD"` (UTC). For past days `asOf` is end-of-day
        (23:59:59.999Z); the final point uses `now()` so the last bar reflects
        real-time balance. Empty households return `byCurrency: []` with a
        current `asOf`. Any household member role is permitted.
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        '200':
          description: Household-wide daily balance history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountsBalanceHistoryAllResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /accounts/reorder:
    post:
      operationId: reorderAccounts
      summary: Reorder accounts (full-set)
      description: |
        Body carries the full desired ordering of non-archived accounts in the
        household. Server normalizes displayOrder to dense 0..N-1 in one transaction.
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderAccountsInput' }
      responses:
        '200':
          description: New ordering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReorderAccountsResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /accounts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Account ULID
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      operationId: getAccount
      summary: Get one account
      tags: [accounts]
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateAccount
      summary: Update mutable account fields
      description: |
        `type` and `currencyCode` are immutable post-create. Attempting to change
        either returns ACCOUNT_FIELD_IMMUTABLE (422). Opening balance edits are
        only permitted while the account has zero non-deleted transactions;
        otherwise ACCOUNT_OPENING_BALANCE_LOCKED (409).
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: archiveAccount
      summary: Archive (or hard-delete) an account
      description: |
        Archives the account (sets archivedAt). If the account has zero lifetime
        transactions (including soft-deleted), behaves as a true delete and sets
        deletedAt instead; in that case the account will no longer appear even
        when includeArchived=true. Idempotent: re-archiving returns 200 with the
        current Account.
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Archived (or hard-deleted) account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /accounts/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: restoreAccount
      summary: Restore an archived account
      description: |
        Clears archivedAt. Returns RESOURCE_NOT_FOUND if the account was
        hard-deleted. Idempotent.
      tags: [accounts]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Restored account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /accounts/{id}/balance-history:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      operationId: getAccountBalanceHistory
      summary: Trailing N-month balance history
      description: |
        Returns exactly `months` points, ordered oldest→newest, one per month.
        For each month `m`, `asOf` is 23:59:59.999Z of the last day of month `m`
        (UTC); the current month uses `now()` instead. Buckets earlier than
        `openingBalanceAt` report `openingBalanceMinor` unchanged.
      tags: [accounts]
      parameters:
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        '200':
          description: Balance history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceHistoryResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /categories:
    get:
      operationId: listCategories
      summary: List categories visible to the current household
      description: |
        Returns both system-default categories (householdId = null) and
        household-custom categories. Ordering: system rows first (alphabetical
        by label), then household rows by displayOrder ASC, createdAt ASC.
      tags: [categories]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: type
          in: query
          required: false
          description: Filter by type. Omit to include all (including reserved TRANSFER row).
          schema: { type: string, enum: [INCOME, EXPENSE] }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Categories page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoriesPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCategory
      summary: Create a household-custom category
      description: |
        Creates a category scoped to the active household. type=TRANSFER is
        rejected with CATEGORY_TYPE_INVALID — the reserved system TRANSFER
        category is the only row with that type.
      tags: [categories]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /categories/reorder:
    post:
      operationId: reorderCategories
      summary: Reorder household categories (full-set)
      description: |
        Body carries the desired ordering of household-custom categories.
        System rows are never mutated; any system id in the body returns
        CATEGORY_SYSTEM_READONLY. Server normalizes displayOrder to dense
        0..N-1 within the household scope in one transaction.
      tags: [categories]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderCategoriesInput' }
      responses:
        '200':
          description: New ordering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReorderCategoriesResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Category ULID.
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      operationId: getCategory
      summary: Get one category
      tags: [categories]
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCategory
      summary: Update a household-custom category
      description: |
        Updates the mutable fields of a household-custom category. System rows
        (householdId = null) return CATEGORY_SYSTEM_READONLY (403). Attempts
        to change `type` return CATEGORY_TYPE_IMMUTABLE (422).
      tags: [categories]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategoryInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: archiveCategory
      summary: Archive (or hard-delete) a household-custom category
      description: |
        Archives the category (sets archivedAt). If the category has zero
        lifetime transactions (including soft-deleted), behaves as a true
        delete and sets deletedAt instead. System rows return
        CATEGORY_SYSTEM_READONLY (403). Idempotent: re-archiving returns 200.
      tags: [categories]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Archived (or hard-deleted) category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /categories/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: restoreCategory
      summary: Restore an archived household-custom category
      description: |
        Clears archivedAt. System rows return CATEGORY_SYSTEM_READONLY.
        Hard-deleted rows return RESOURCE_NOT_FOUND. Idempotent.
      tags: [categories]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Restored category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /transactions:
    get:
      operationId: listTransactions
      summary: List transactions with filters
      description: |
        Keyset cursor paginated. Order: occurredAt DESC, id DESC. Filters
        compose with AND. `accountId` and `categoryId` accept either a single
        value or a repeated query parameter. `includeDeleted=true` is honored
        for OWNER/ADMIN only and silently forced to false otherwise. When
        `transferId` is set, returns both pair-rows and ignores other filters
        except `includeDeleted`.
      tags: [transactions]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: accountId
          in: query
          required: false
          description: Single account id or repeated parameter.
          schema:
            type: array
            items: { type: string }
          explode: true
          style: form
        - name: categoryId
          in: query
          required: false
          description: Single category id or repeated parameter.
          schema:
            type: array
            items: { type: string }
          explode: true
          style: form
        - name: type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TransactionType' }
        - name: from
          in: query
          required: false
          description: ISO date-time (UTC), inclusive lower bound on occurredAt.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: ISO date-time (UTC), inclusive upper bound on occurredAt.
          schema: { type: string, format: date-time }
        - name: q
          in: query
          required: false
          description: Free-text note search. Trimmed; 1..100 chars; case-insensitive.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: includeDeleted
          in: query
          required: false
          description: OWNER/ADMIN only. Silently forced to false for MEMBER/VIEWER.
          schema: { type: boolean, default: false }
        - name: transferId
          in: query
          required: false
          description: Restricts the response to both pair-rows of a transfer.
          schema: { type: string }
      responses:
        '200':
          description: Transactions page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionsPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTransaction
      summary: Create a standalone transaction (INCOME or EXPENSE)
      description: |
        Creates a single transaction. type=TRANSFER is rejected — transfers
        must be created via POST /transfers. The row's currencyCode MUST
        equal the target account's currency; mismatch returns
        TRANSACTION_CURRENCY_MISMATCH (422). Archived accounts reject with
        ACCOUNT_ARCHIVED (409).
      tags: [transactions]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /transactions/period-summary:
    get:
      operationId: getTransactionsPeriodSummary
      summary: Income/expense/net aggregates for a period
      description: |
        Returns per-currency income, expense, net, and transaction count for
        the requested period. TRANSFER rows are excluded (transfers net to
        zero). Query semantics:
          * `period` — named window: `day` / `week` (ISO week starting Monday)
            / `month` / `year`. Boundary is `[start-of-window, now()]` (UTC).
          * `from` + `to` — inclusive custom range (ISO date-time, UTC). Both
            must be supplied together; `from < to`; span ≤ 366 days; `to`
            must not exceed `now() + 1min`.
        If both `period` and `from`/`to` are supplied, the request is
        rejected with `VALIDATION_ERROR` (422). When neither is supplied,
        defaults to `period=month`. Any household member role is permitted.
      tags: [transactions]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: period
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PeriodEnum' }
        - name: from
          in: query
          required: false
          description: ISO date-time (UTC), inclusive lower bound. Required together with `to`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: ISO date-time (UTC), inclusive upper bound. Required together with `from`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Period summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodSummaryResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /transactions/bulk-create:
    post:
      operationId: bulkCreateTransactions
      summary: Create up to 500 transactions atomically
      description: |
        All-or-nothing bulk insert. Runs in a single Prisma transaction;
        a single failing item aborts the whole batch (no partial state, no
        partial balance drift). Role: MEMBER+.
      tags: [transactions]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkCreateTransactionsInput' }
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkCreateTransactionsResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /transactions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Transaction ULID.
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      operationId: getTransaction
      summary: Get one transaction
      tags: [transactions]
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateTransaction
      summary: Update mutable transaction fields
      description: |
        Partial update of accountId, categoryId, amountMinor, occurredAt,
        note. `type`, `currencyCode`, `transferId` are immutable — sending
        them returns VALIDATION_ERROR. Rows with transferId != null reject
        with TRANSACTION_BELONGS_TO_TRANSFER (409). An accountId change to
        an account of a different currency returns
        TRANSACTION_CURRENCY_MISMATCH (422).
      tags: [transactions]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTransactionInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTransaction
      summary: Soft-delete a transaction
      description: |
        Reverses the signed balance delta and sets deletedAt. Blocks
        transfer pair-rows (transferId != null) with
        TRANSACTION_BELONGS_TO_TRANSFER (409). Idempotent: re-delete is a
        200 no-op returning the already-deleted row.
      tags: [transactions]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Soft-deleted transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /transactions/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: restoreTransaction
      summary: Restore a soft-deleted transaction
      description: |
        Re-applies the signed balance delta. Blocks with ACCOUNT_ARCHIVED
        (409) if the account has since been archived.
      tags: [transactions]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Restored transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /transfers:
    post:
      operationId: createTransfer
      summary: Create an atomic transfer between two household accounts
      description: |
        Single Prisma transaction writes the transfers row and both paired
        transactions (one EXPENSE-style row on source, one INCOME-style row
        on destination), both tagged with the reserved system TRANSFER
        category. sourceAccountId and destinationAccountId must differ
        (TRANSFER_SAME_ACCOUNT, 422), both accounts must be active
        (TRANSFER_ACCOUNT_ARCHIVED, 409), and both accounts' currencyCode
        must equal the transfer currencyCode (TRANSFER_CURRENCY_MISMATCH,
        422).
      tags: [transfers]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransferInput' }
      responses:
        '201':
          description: Created transfer with paired transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferWithPairedTransactions' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /transfers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Transfer ULID.
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      operationId: getTransfer
      summary: Get a transfer with its paired transactions
      tags: [transfers]
      responses:
        '200':
          description: Transfer with paired transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferWithPairedTransactions' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateTransfer
      summary: Transfers are immutable
      description: |
        Always returns 405 TRANSFER_IMMUTABLE. Documented explicitly so the
        generated client does not synthesize a mutation hook. Users must
        delete and recreate.
      tags: [transfers]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '405':
          description: Transfer update is never permitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTransfer
      summary: Soft-delete a transfer and both pair-rows
      description: |
        Soft-deletes the transfer + both paired transactions and reverses
        both balance deltas in a single Prisma transaction. Idempotent.
      tags: [transfers]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Soft-deleted transfer with paired transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferWithPairedTransactions' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /transfers/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: restoreTransfer
      summary: Restore a soft-deleted transfer
      description: |
        Restores the transfer and both paired transactions and re-applies
        both balance deltas. Blocks with ACCOUNT_ARCHIVED (409) if either
        account is currently archived.
      tags: [transfers]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Restored transfer with paired transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferWithPairedTransactions' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /bills:
    get:
      operationId: listBills
      summary: List bills with filters
      description: |
        Cursor paginated. Order: displayOrder ASC, createdAt ASC. Archived rows
        (archivedAt IS NOT NULL) are excluded unless `includeArchived=true`.
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, due-soon, active, paused]
            default: all
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BillStatus' }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Bills page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillsPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createBill
      summary: Create a bill
      description: |
        Creates a recurring bill. `currencyCode` is derived server-side from the
        target account and is NOT accepted on the input. `customDays` is
        required when `cycle = CUSTOM_DAYS` and rejected otherwise. The
        referenced category must be of type EXPENSE; otherwise
        BILL_CATEGORY_TYPE_INVALID (422). Archived accounts reject with
        BILL_ACCOUNT_ARCHIVED (409).
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBillInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /bills/summary:
    get:
      operationId: getBillsSummary
      summary: Per-currency bills totals
      description: |
        Returns per-currency monthly-normalized cost and due-soon totals across
        active (non-archived) bills, plus household-wide active/paused counts.
        Any household member role is permitted.
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
      responses:
        '200':
          description: Bills summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillsSummaryResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /bills/upcoming:
    get:
      operationId: getBillsUpcoming
      summary: Bills due within the next N days
      description: |
        Returns active (non-paused, non-archived) bills whose nextDueAt falls
        within `[now(), now() + days]` (UTC), oldest→newest. Any household
        member role is permitted.
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 14
      responses:
        '200':
          description: Upcoming bills
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillsUpcomingResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /bills/reorder:
    post:
      operationId: reorderBills
      summary: Reorder bills (full-set)
      description: |
        Body carries the full desired ordering of non-archived bills in the
        household. Server normalizes displayOrder to dense 0..N-1 in one
        transaction.
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderBillsInput' }
      responses:
        '200':
          description: New ordering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReorderBillsResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /bills/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Bill ULID.
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      operationId: getBill
      summary: Get one bill
      tags: [bills]
      responses:
        '200':
          description: Bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateBill
      summary: Update mutable bill fields
      description: |
        Partial update. `currencyCode` is immutable (derived from the account)
        and sending it returns BILL_CURRENCY_IMMUTABLE (422). An accountId
        change to an account of a different currency returns
        BILL_CURRENCY_MISMATCH (422). Archived accounts return
        BILL_ACCOUNT_ARCHIVED (409). Category type mismatch returns
        BILL_CATEGORY_TYPE_INVALID (422). `endAt` before `nextDueAt` returns
        BILL_END_AT_BEFORE_NEXT_DUE (422). `cycle = CUSTOM_DAYS` without a
        valid `customDays` returns BILL_CUSTOM_DAYS_REQUIRED or
        BILL_CUSTOM_DAYS_INVALID (422).
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBillInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: archiveBill
      summary: Archive (or hard-delete) a bill
      description: |
        Archives the bill (sets archivedAt). If the bill has zero lifetime
        payments, behaves as a true delete and sets deletedAt instead.
        Idempotent: re-archiving returns 200.
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Archived (or hard-deleted) bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /bills/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: restoreBill
      summary: Restore an archived bill
      description: |
        Clears archivedAt. Returns RESOURCE_NOT_FOUND if the bill was
        hard-deleted. Idempotent.
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Restored bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /bills/{id}/pause:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: pauseBill
      summary: Pause a bill
      description: |
        Transitions status ACTIVE → PAUSED. If already PAUSED, returns
        BILL_ALREADY_PAUSED (409).
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Paused bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /bills/{id}/resume:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: resumeBill
      summary: Resume a paused bill
      description: |
        Transitions status PAUSED → ACTIVE. If already ACTIVE, returns
        BILL_ALREADY_ACTIVE (409). Also rolls `nextDueAt` forward if needed so
        it is not in the past.
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Resumed bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /bills/{id}/mark-paid:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: markBillPaid
      summary: Record a payment against a bill
      description: |
        Writes a BillPayment row for the current cycle, creates the backing
        EXPENSE Transaction on the bill's account, advances `nextDueAt` to the
        next cycle, and updates `lastPaidAt`. All within a single Prisma
        transaction. Archived accounts return BILL_ACCOUNT_ARCHIVED (409).
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkBillPaidInput' }
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarkBillPaidResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /bills/{id}/payments/{paymentId}/undo:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: paymentId
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: undoBillPayment
      summary: Undo the latest payment for a bill
      description: |
        Soft-deletes the referenced BillPayment and its backing Transaction
        and rewinds `nextDueAt` one cycle. Only the latest non-deleted payment
        may be undone; otherwise BILL_PAYMENT_NOT_LATEST (409).
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Restored bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /bills/{id}/payments:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      operationId: listBillPayments
      summary: List payment history for a bill
      description: |
        Cursor paginated. Order: paidAt DESC, id DESC. Excludes soft-deleted
        payment rows.
      tags: [bills]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Bill payments page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillPaymentsPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /budgets:
    get:
      operationId: listBudgets
      summary: List budgets with filters
      description: |
        Cursor paginated. Order: displayOrder ASC, createdAt ASC. Archived
        rows (archivedAt IS NOT NULL) are excluded unless
        `includeArchived=true`. Any household member role is permitted.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: scope
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BudgetScope' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BudgetStatus' }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Budgets page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetsPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createBudget
      summary: Create a budget
      description: |
        Creates a household-wide or per-category budget. Scope / categoryId
        coupling is enforced in the service: scope=HOUSEHOLD with a non-null
        categoryId returns BUDGET_CATEGORY_FORBIDDEN (422); scope=CATEGORY
        with a null categoryId returns BUDGET_CATEGORY_REQUIRED (422). The
        referenced category must be EXPENSE-typed (otherwise
        BUDGET_CATEGORY_TYPE_INVALID, 422) and non-archived (otherwise
        BUDGET_CATEGORY_ARCHIVED, 409). Duplicate active (scope, currency,
        category) returns BUDGET_ALREADY_EXISTS (409). Roles: MEMBER+.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBudgetInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /budgets/status:
    get:
      operationId: getBudgetsStatus
      summary: Computed status for every active budget
      description: |
        Returns per-budget computed fields for the current period: spent,
        effective ceiling (base + rollover carry-in), remaining, progress,
        thresholds already fired, and booleans flags. Only ACTIVE,
        non-deleted budgets are considered; archived rows are excluded
        unless `includeArchived=true`. `asOf` defaults to now() UTC. All
        monetary amounts are minor-unit bigint-safe decimal strings. Any
        household member role is permitted.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: scope
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BudgetScope' }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: UTC instant at which to compute status. Defaults to now().
      responses:
        '200':
          description: Budgets status snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetsStatusResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /budgets/suggest:
    get:
      operationId: getBudgetsSuggest
      summary: Suggested per-category budgets based on trailing 30-day spend
      description: |
        Returns up to 5 EXPENSE categories with no active non-archived
        budget in the household's default currency. `suggestedAmountMinor`
        is the trailing 30-day spend rounded up by 10% to the next 1000
        minor units (i.e. next 10 major units). Any household member role
        is permitted.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
      responses:
        '200':
          description: Budget suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetSuggestionsResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /budgets/reorder:
    post:
      operationId: reorderBudgets
      summary: Reorder budgets (full-set)
      description: |
        Body carries the full desired ordering of non-archived budgets in
        the household. Server normalizes displayOrder to dense 0..N-1 in
        one transaction. Roles: ADMIN+.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderBudgetsInput' }
      responses:
        '200':
          description: New ordering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReorderBudgetsResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /budgets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
        description: Budget ULID.
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      operationId: getBudget
      summary: Get one budget
      tags: [budgets]
      responses:
        '200':
          description: Budget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateBudget
      summary: Update mutable budget fields
      description: |
        Partial update. Mutable fields: name, amountMinor, rollover, endAt,
        displayOrder. `scope` and `categoryId` are immutable
        (BUDGET_SCOPE_IMMUTABLE 422); `currencyCode` is immutable
        (BUDGET_CURRENCY_IMMUTABLE 422); `period` is immutable
        (BUDGET_PERIOD_IMMUTABLE 422); `startAt` is immutable (included
        under BUDGET_SCOPE_IMMUTABLE). On successful amount / rollover
        change the server re-evaluates thresholds for the current period
        synchronously. Roles: MEMBER+.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBudgetInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: archiveBudget
      summary: Archive a budget
      description: |
        Archives the budget (sets archivedAt). Threshold-notification rows
        are preserved for audit. Idempotent: re-archiving returns 200.
        Roles: ADMIN+.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Archived budget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /budgets/{id}/history:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    get:
      operationId: getBudgetHistory
      summary: Per-period history for a budget
      description: |
        Returns the last N period buckets (newest-first) with effective
        ceiling, spent, remaining, overspent flag, and thresholds fired
        for each period. `periods` defaults to 6 and is capped at 24. Any
        household member role is permitted.
      tags: [budgets]
      parameters:
        - name: periods
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        '200':
          description: Budget history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetHistoryResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /budgets/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: restoreBudget
      summary: Restore an archived budget
      description: |
        Clears archivedAt. Enforces the unique-active invariant; if a
        currently-active budget already claims the same (scope, currency,
        category) slot, returns BUDGET_ALREADY_EXISTS (409). Idempotent
        when the budget is already active. Roles: ADMIN+.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Restored budget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /budgets/{id}/pause:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: pauseBudget
      summary: Pause a budget
      description: |
        Transitions status ACTIVE → PAUSED. If already PAUSED, returns
        BUDGET_ALREADY_PAUSED (409). Paused budgets are skipped by the
        scheduler and real-time threshold evaluator. Roles: MEMBER+.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Paused budget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /budgets/{id}/resume:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - { $ref: '#/components/parameters/HouseholdId' }
    post:
      operationId: resumeBudget
      summary: Resume a paused budget
      description: |
        Transitions status PAUSED → ACTIVE. If already ACTIVE, returns
        BUDGET_ALREADY_ACTIVE (409). Roles: MEMBER+.
      tags: [budgets]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Resumed budget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /notifications/unread-count:
    get:
      operationId: getNotificationsUnreadCount
      summary: Count of unread notifications for the current user
      description: |
        Returns the number of notifications for the authenticated user where
        `readAt IS NULL`. Scope is user-only: notifications follow a user
        across households, so `X-Household-Id` is NOT required and is
        ignored if sent. The value is capped at `9999` — any true count of
        `9999` or greater is returned as `9999` (clients render `99+`).
        Any authenticated user may call this endpoint.
      tags: [notifications]
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCountResponse' }
        '401': { $ref: '#/components/responses/Error' }

  /invites/accept:
    post:
      operationId: acceptInvite
      summary: Accept a household invite by token
      tags: [households]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Joined household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSummary' }
        '400': { $ref: '#/components/responses/Error' }

  /stats/overview:
    get:
      operationId: getStatsOverview
      summary: Period summary with deltas and top expense categories
      description: |
        Hero data for the Stats screen. Returns income/expense/net totals for the
        current period, deltas vs the equivalent previous period, and the top
        expense categories (primary-currency scope). Excludes TRANSFER rows.

        Week semantics: `period=week` is the full Monday→next-Monday UTC window
        (NOT week-to-date). This diverges from `GET /transactions/period-summary`
        which returns week-to-date.
      tags: [stats]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: period
          in: query
          required: true
          schema: { $ref: '#/components/schemas/StatsPeriodKind' }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Required when `period=custom`. ISO 8601 UTC. Paired with `to`.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Required when `period=custom`. ISO 8601 UTC. Exclusive upper bound.
        - name: topCategoriesLimit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: Overview payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsOverviewResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /stats/monthly-trend:
    get:
      operationId: getStatsMonthlyTrend
      summary: Monthly income/expense series per currency
      description: |
        Returns one series per currency the household has transacted in within
        the window. Each series has exactly `months` points, oldest→newest,
        including zero-activity months. Excludes TRANSFER rows. Months are
        calendar months, UTC.
      tags: [stats]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: months
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
        - name: currencyCode
          in: query
          required: false
          schema: { type: string, minLength: 3, maxLength: 3 }
          description: ISO 4217 code. When omitted, every currency present in the window is returned.
      responses:
        '200':
          description: Monthly trend payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyTrendResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /stats/category-breakdown:
    get:
      operationId: getStatsCategoryBreakdown
      summary: Category totals for the donut chart
      description: |
        Per-currency bucket of category totals for the selected period and type.
        Items sorted by `amountMinor DESC`. Excludes TRANSFER rows. When
        `totalMinor=0`, `percentOfTotal` is omitted from items.
      tags: [stats]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: period
          in: query
          required: true
          schema: { $ref: '#/components/schemas/StatsPeriodKind' }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Required when `period=custom`.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Required when `period=custom`.
        - name: type
          in: query
          required: false
          description: Restricted to INCOME or EXPENSE at the service layer (TRANSFER rejected).
          schema:
            allOf:
              - { $ref: '#/components/schemas/TransactionType' }
            default: EXPENSE
        - name: currencyCode
          in: query
          required: false
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200':
          description: Category breakdown payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryBreakdownResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /stats/daily-spend:
    get:
      operationId: getStatsDailySpend
      summary: Daily expense series for the heatmap
      description: |
        EXPENSE-only daily totals for a rolling window. Each currency series has
        exactly `days` points, oldest→newest, including zero-spend days.
        `intensityCapMinor` is the 99th-percentile daily amount (or max when
        fewer than 10 non-zero days). Excludes TRANSFER rows. Dates are
        `YYYY-MM-DD` UTC.
      tags: [stats]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 7, maximum: 365, default: 90 }
        - name: currencyCode
          in: query
          required: false
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200':
          description: Daily spend payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySpendResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /stats/category-sparkline:
    get:
      operationId: getStatsCategorySparkline
      summary: Per-category daily sparkline series
      description: |
        Daily `amountMinor` per requested category in the household's primary
        currency. Each item has exactly `days` points, oldest→newest. Returned
        items preserve input order of `categoryIds`. Unknown or foreign category
        ids return 422 with `details.invalidCategoryIds`.
      tags: [stats]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: categoryIds
          in: query
          required: true
          description: |
            ULIDs of categories to chart. Repeat the param (1..10 values). The
            service rejects unknown / cross-household / archived-and-deleted ids
            with 422 `VALIDATION_ERROR`.
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 10
            items: { type: string }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 7, maximum: 90, default: 30 }
      responses:
        '200':
          description: Sparkline payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategorySparklineResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /stats/sankey:
    get:
      operationId: getStatsSankey
      summary: Source-to-target flow data for the Sankey chart
      description: |
        Single-currency Sankey nodes and links for the selected period. Income
        categories appear as sources; expense categories, plus synthetic
        `savings` and `transfer_out` nodes when applicable, appear as targets.
        `currencyCode` defaults to the household's `defaultCurrencyCode`, falling
        back to the currency with the largest absolute sum of (income+expense)
        in the window when the default has no activity. TRANSFER rows are
        excluded from income/expense tallies and only surface via the
        `transfer_out` node (cross-currency outflows only).
      tags: [stats]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: period
          in: query
          required: true
          schema: { $ref: '#/components/schemas/StatsPeriodKind' }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Required when `period=custom`.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Required when `period=custom`.
        - name: currencyCode
          in: query
          required: false
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200':
          description: Sankey payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SankeyResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Optional idempotency key (opaque). Replays return the original response for 24h.
    HouseholdId:
      name: X-Household-Id
      in: header
      required: true
      schema: { type: string }
      description: ULID of the active household. Scopes every tenant-owned request.

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        timestamp: { type: string, format: date-time }

    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. Clients branch on this value, not
        on HTTP status alone. Add new codes here before the backend emits them.
      enum:
        - VALIDATION_ERROR
        - RESOURCE_NOT_FOUND
        - FORBIDDEN_ROLE
        - ACCOUNT_NICKNAME_TAKEN
        - ACCOUNT_FIELD_IMMUTABLE
        - ACCOUNT_OPENING_BALANCE_LOCKED
        - ACCOUNT_ARCHIVED
        - CURRENCY_UNSUPPORTED
        - TRANSACTION_CURRENCY_MISMATCH
        - TRANSACTION_BELONGS_TO_TRANSFER
        - TRANSFER_SAME_ACCOUNT
        - TRANSFER_CURRENCY_MISMATCH
        - TRANSFER_ACCOUNT_ARCHIVED
        - TRANSFER_IMMUTABLE
        - CATEGORY_SYSTEM_READONLY
        - CATEGORY_TYPE_IMMUTABLE
        - CATEGORY_TYPE_INVALID
        - BILL_CATEGORY_TYPE_INVALID
        - BILL_CURRENCY_MISMATCH
        - BILL_ACCOUNT_ARCHIVED
        - BILL_ALREADY_PAUSED
        - BILL_ALREADY_ACTIVE
        - BILL_CUSTOM_DAYS_REQUIRED
        - BILL_CUSTOM_DAYS_INVALID
        - BILL_CURRENCY_IMMUTABLE
        - BILL_PAYMENT_NOT_LATEST
        - BILL_END_AT_BEFORE_NEXT_DUE
        - BUDGET_ALREADY_EXISTS
        - BUDGET_CATEGORY_TYPE_INVALID
        - BUDGET_CATEGORY_REQUIRED
        - BUDGET_CATEGORY_FORBIDDEN
        - BUDGET_CATEGORY_ARCHIVED
        - BUDGET_CURRENCY_IMMUTABLE
        - BUDGET_SCOPE_IMMUTABLE
        - BUDGET_PERIOD_IMMUTABLE
        - BUDGET_ALREADY_PAUSED
        - BUDGET_ALREADY_ACTIVE

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: object
              additionalProperties: true

    Pagination:
      type: object
      description: |
        Base shape for cursor-paginated list responses. Concrete list envelopes
        (e.g. AccountsPage) compose this base via `allOf` with a typed `items`
        array.
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: |
            Opaque cursor for the next page. `null` when there are no more
            pages. Pass back verbatim as the `cursor` query parameter.

    OtpRequestBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    OtpRequestResult:
      type: object
      required: [sent, expiresInSeconds]
      properties:
        sent: { type: boolean }
        expiresInSeconds: { type: integer }

    OtpVerifyBody:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, minLength: 6, maxLength: 6 }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user, households]
          properties:
            user: { $ref: '#/components/schemas/User' }
            households:
              type: array
              items: { $ref: '#/components/schemas/HouseholdSummary' }

    RefreshBody:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    User:
      type: object
      required: [id, email, primaryCurrencyCode, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        primaryCurrencyCode: { type: string }
        createdAt: { type: string, format: date-time }

    Me:
      type: object
      required: [user, households]
      properties:
        user: { $ref: '#/components/schemas/User' }
        households:
          type: array
          items: { $ref: '#/components/schemas/HouseholdSummary' }

    PushTokenCreate:
      type: object
      required: [platform, token]
      properties:
        platform: { type: string, enum: [ios, android, web] }
        token: { type: string }
        expoPushToken: { type: [string, 'null'] }

    PushToken:
      type: object
      required: [id, platform, token, createdAt]
      properties:
        id: { type: string }
        platform: { type: string, enum: [ios, android, web] }
        token: { type: string }
        expoPushToken: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    HouseholdRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER, VIEWER]

    HouseholdSummary:
      type: object
      required: [id, name, role, defaultCurrencyCode]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/HouseholdRole' }
        defaultCurrencyCode: { type: string }

    Household:
      type: object
      required: [id, name, defaultCurrencyCode, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        defaultCurrencyCode: { type: string }
        createdAt: { type: string, format: date-time }

    HouseholdCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        defaultCurrencyCode: { type: string, minLength: 3, maxLength: 3 }

    HouseholdUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        defaultCurrencyCode: { type: string, minLength: 3, maxLength: 3 }

    HouseholdMember:
      type: object
      required: [id, userId, role, email, joinedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        email: { type: string }
        name: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/HouseholdRole' }
        joinedAt: { type: string, format: date-time }

    HouseholdInviteCreate:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/HouseholdRole' }

    HouseholdInvite:
      type: object
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/HouseholdRole' }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }

    HouseholdInviteWithToken:
      allOf:
        - $ref: '#/components/schemas/HouseholdInvite'
        - type: object
          required: [token]
          properties:
            token: { type: string }

    AccountType:
      type: string
      enum: [DEBIT, CREDIT, SAVINGS, CASH]
      description: |
        DEBIT covers checking/current/debit card; CREDIT covers credit cards
        and lines of credit (typically negative or owed balance); SAVINGS is
        a deposit/interest account; CASH is a wallet. LOAN / INVESTMENT are
        deliberately out of scope for v1.

    Account:
      type: object
      required:
        - id
        - householdId
        - nickname
        - type
        - currencyCode
        - institution
        - last4
        - colorToken
        - iconToken
        - openingBalanceMinor
        - openingBalanceAt
        - cachedBalanceMinor
        - cachedBalanceAt
        - displayOrder
        - archivedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: ULID.
        householdId:
          type: string
          description: Owning household ULID.
        nickname:
          type: string
          minLength: 1
          maxLength: 60
        type: { $ref: '#/components/schemas/AccountType' }
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 uppercase code. Immutable after creation.
        institution:
          type: [string, 'null']
          maxLength: 80
        last4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
        colorToken:
          type: string
          description: Key into `account.colors` design token set.
        iconToken:
          type: string
          description: Key into `account.icons` design token set.
        openingBalanceMinor:
          type: string
          description: |
            Signed integer amount in the account currency's minor units, encoded
            as a decimal string for bigint-safety over JSON.
        openingBalanceAt:
          type: string
          format: date-time
          description: |
            Timestamp at which `openingBalanceMinor` is the truth. Transactions
            dated before this instant do not affect cached balance. UTC.
        cachedBalanceMinor:
          type: string
          description: |
            Denormalized current balance in minor units, maintained by the
            BalanceService. String for bigint-safety.
        cachedBalanceAt:
          type: string
          format: date-time
          description: Timestamp of the last cached-balance recompute. UTC.
        displayOrder:
          type: integer
          minimum: 0
          description: Dense 0..N-1 ordering per household.
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: Set when the account is user-archived; hidden from default lists.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAccountInput:
      type: object
      required: [nickname, type, currencyCode]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 60
        type: { $ref: '#/components/schemas/AccountType' }
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        institution:
          type: [string, 'null']
          maxLength: 80
        last4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
        colorToken: { type: string }
        iconToken: { type: string }
        openingBalanceMinor:
          type: string
          description: |
            Signed decimal-string minor-units amount. Defaults to "0" if omitted.
        openingBalanceAt:
          type: string
          format: date-time
          description: Defaults to `now()` if omitted. UTC.

    UpdateAccountInput:
      type: object
      description: |
        All fields optional. `type` and `currencyCode` are intentionally absent:
        changing either returns ACCOUNT_FIELD_IMMUTABLE. Opening-balance fields
        are only accepted while the account has zero non-deleted transactions.
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 60
        institution:
          type: [string, 'null']
          maxLength: 80
        last4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
        colorToken: { type: string }
        iconToken: { type: string }
        openingBalanceMinor: { type: string }
        openingBalanceAt: { type: string, format: date-time }

    AccountsPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Account' }

    AccountsSummaryBucket:
      type: object
      required: [currencyCode, totalMinor, accountCount]
      properties:
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        totalMinor:
          type: string
          description: Sum of cachedBalanceMinor for active accounts in this currency (bigint-safe string).
        accountCount:
          type: integer
          minimum: 0

    AccountsSummaryResponse:
      type: object
      required: [byCurrency, totalAccounts, asOf]
      properties:
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/AccountsSummaryBucket' }
        totalAccounts:
          type: integer
          minimum: 0
          description: Count of active (non-archived, non-deleted) accounts.
        asOf:
          type: string
          format: date-time
          description: Server time at which the summary was computed. UTC.

    BalanceHistoryPoint:
      type: object
      required: [bucket, asOf, balanceMinor]
      properties:
        bucket:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: Month key "YYYY-MM" (UTC).
        asOf:
          type: string
          format: date-time
          description: |
            End-of-month instant (UTC) for past months; `now()` for the current
            month's point.
        balanceMinor:
          type: string
          description: Account balance in minor units at `asOf`, as a bigint-safe decimal string.

    BalanceHistoryResponse:
      type: object
      required: [accountId, currencyCode, points]
      properties:
        accountId: { type: string }
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        points:
          type: array
          description: Oldest→newest. Length equals the requested `months` window.
          items: { $ref: '#/components/schemas/BalanceHistoryPoint' }

    BalanceHistoryDailyPoint:
      type: object
      required: [bucket, asOf, balanceMinor]
      properties:
        bucket:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
          description: Day key "YYYY-MM-DD" (UTC).
        asOf:
          type: string
          format: date-time
          description: |
            End-of-day instant (23:59:59.999Z UTC) for past days; `now()` for
            the current day's point.
        balanceMinor:
          type: string
          description: Aggregated balance in minor units at `asOf`, as a bigint-safe decimal string.

    AccountsBalanceHistoryAllBucket:
      type: object
      required: [currencyCode, points]
      properties:
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        points:
          type: array
          description: |
            Oldest→newest. Length equals the requested `days` window. Every
            bucket exists even when no activity that day (flat-forward from
            the previous day's value).
          items: { $ref: '#/components/schemas/BalanceHistoryDailyPoint' }

    AccountsBalanceHistoryAllResponse:
      type: object
      required: [byCurrency, asOf]
      properties:
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/AccountsBalanceHistoryAllBucket' }
        asOf:
          type: string
          format: date-time
          description: Server time at which the history was computed. UTC.

    ReorderAccountsEntry:
      type: object
      required: [id, displayOrder]
      properties:
        id: { type: string }
        displayOrder:
          type: integer
          minimum: 0

    ReorderAccountsInput:
      type: object
      required: [order]
      properties:
        order:
          type: array
          items: { $ref: '#/components/schemas/ReorderAccountsEntry' }

    ReorderAccountsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Account' }

    CategoryType:
      type: string
      enum: [INCOME, EXPENSE, TRANSFER]
      description: |
        Category type. TRANSFER is reserved for the single system row that
        backs transfer pair-transactions; users cannot create TRANSFER
        categories.

    Category:
      type: object
      required:
        - id
        - householdId
        - key
        - label
        - type
        - iconToken
        - colorToken
        - displayOrder
        - isSystem
        - archivedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, description: ULID. }
        householdId:
          type: [string, 'null']
          description: |
            Owning household ULID. NULL identifies a system-default row
            visible to every household.
        key:
          type: string
          minLength: 1
          maxLength: 48
          pattern: '^[a-z0-9_]+$'
          description: Machine-stable slug. Immutable after creation.
        label:
          type: string
          minLength: 1
          maxLength: 40
        type: { $ref: '#/components/schemas/CategoryType' }
        iconToken:
          type: string
          description: Key into `category.icons` design token set.
        colorToken:
          type: string
          description: Key into `category.colors` design token set.
        displayOrder:
          type: integer
          minimum: 0
          description: Dense 0..N-1 ordering within the owning scope (system or per-household).
        isSystem:
          type: boolean
          description: |
            Convenience flag — derivable from `householdId === null` but
            serialized so clients do not have to reimplement the check.
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: Set when the category is user-archived; hidden from pickers by default.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateCategoryInput:
      type: object
      required: [label, type]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        type:
          type: string
          enum: [INCOME, EXPENSE]
          description: TRANSFER is rejected with CATEGORY_TYPE_INVALID.
        iconToken: { type: string }
        colorToken: { type: string }
        displayOrder:
          type: integer
          minimum: 0

    UpdateCategoryInput:
      type: object
      description: |
        All fields optional. `key`, `type`, `householdId` are immutable.
        Sending `type` returns CATEGORY_TYPE_IMMUTABLE (422). System rows
        reject any PATCH with CATEGORY_SYSTEM_READONLY (403).
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        iconToken: { type: string }
        colorToken: { type: string }
        displayOrder:
          type: integer
          minimum: 0

    ReorderCategoriesEntry:
      type: object
      required: [id, displayOrder]
      properties:
        id: { type: string }
        displayOrder:
          type: integer
          minimum: 0

    ReorderCategoriesInput:
      type: object
      required: [order]
      properties:
        order:
          type: array
          items: { $ref: '#/components/schemas/ReorderCategoriesEntry' }

    ReorderCategoriesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    CategoriesPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Category' }

    TransactionType:
      type: string
      enum: [INCOME, EXPENSE, TRANSFER]
      description: |
        TRANSFER is reserved for pair-rows created by POST /transfers and is
        rejected on POST /transactions.

    Transaction:
      type: object
      required:
        - id
        - householdId
        - accountId
        - categoryId
        - type
        - amountMinor
        - currencyCode
        - occurredAt
        - note
        - transferId
        - deletedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, description: ULID. }
        householdId: { type: string }
        accountId: { type: string }
        categoryId: { type: string }
        type: { $ref: '#/components/schemas/TransactionType' }
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: |
            POSITIVE integer amount in the owning account's minor units,
            encoded as a decimal string for bigint-safety. Sign is derived
            from `type` server-side; never negative on the wire.
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 uppercase code. MUST equal the owning account's currencyCode. Immutable.
        occurredAt:
          type: string
          format: date-time
          description: User-facing timestamp of the transaction. UTC.
        note:
          type: [string, 'null']
          maxLength: 500
        transferId:
          type: [string, 'null']
          description: Set on both pair-rows of a transfer; NULL on standalone transactions.
        deletedAt:
          type: [string, 'null']
          format: date-time
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTransactionInput:
      type: object
      required: [accountId, categoryId, type, amountMinor, currencyCode]
      properties:
        accountId: { type: string }
        categoryId: { type: string }
        type:
          type: string
          enum: [INCOME, EXPENSE]
          description: TRANSFER is rejected here; use POST /transfers.
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Positive minor-units amount as a decimal string.
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        occurredAt:
          type: string
          format: date-time
          description: Defaults to now() if omitted. UTC.
        note:
          type: [string, 'null']
          maxLength: 500

    UpdateTransactionInput:
      type: object
      description: |
        All fields optional. `type`, `currencyCode`, `transferId` are
        immutable; sending them returns VALIDATION_ERROR. Transfer-paired
        rows reject any PATCH with TRANSACTION_BELONGS_TO_TRANSFER (409).
      properties:
        accountId: { type: string }
        categoryId: { type: string }
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
        occurredAt: { type: string, format: date-time }
        note:
          type: [string, 'null']
          maxLength: 500

    TransactionsPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Transaction' }

    BulkCreateTransactionsInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/CreateTransactionInput' }

    BulkCreateTransactionsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }

    PeriodEnum:
      type: string
      enum: [day, week, month, year]
      description: |
        Named time window, anchored to the current UTC moment:
          * `day` — today UTC (00:00 → now).
          * `week` — ISO week to date, Monday-start (UTC).
          * `month` — first-of-month to now (UTC).
          * `year` — Jan 1 to now (UTC).

    PeriodSummaryBucket:
      type: object
      required: [currencyCode, incomeMinor, expenseMinor, netMinor, transactionCount]
      properties:
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        incomeMinor:
          type: string
          description: Sum of INCOME row amounts (positive, bigint-safe decimal string).
        expenseMinor:
          type: string
          description: Sum of |amount| for EXPENSE rows (positive, bigint-safe decimal string).
        netMinor:
          type: string
          description: |
            `incomeMinor - expenseMinor`. Signed; encoded as a bigint-safe
            decimal string (may start with `-`).
        transactionCount:
          type: integer
          minimum: 0
          description: Count of included INCOME/EXPENSE rows (excludes transfers).

    PeriodSummaryRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
          description: Inclusive lower bound of the resolved window. UTC.
        to:
          type: string
          format: date-time
          description: Inclusive upper bound of the resolved window. UTC.

    PeriodSummaryResponse:
      type: object
      required: [byCurrency, period]
      properties:
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/PeriodSummaryBucket' }
        period: { $ref: '#/components/schemas/PeriodSummaryRange' }

    NotificationUnreadCountResponse:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          minimum: 0
          maximum: 9999
          description: |
            Count of notifications for the authenticated user where
            `readAt IS NULL`. Capped at 9999 — any true count of 9999 or
            greater is returned as 9999.

    Transfer:
      type: object
      required:
        - id
        - householdId
        - sourceAccountId
        - destinationAccountId
        - amountMinor
        - currencyCode
        - occurredAt
        - note
        - deletedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, description: ULID. }
        householdId: { type: string }
        sourceAccountId: { type: string }
        destinationAccountId: { type: string }
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Positive minor-units amount as a decimal string.
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217. MUST equal both accounts' currencyCode.
        occurredAt:
          type: string
          format: date-time
          description: Used as occurredAt on both pair-rows. UTC.
        note:
          type: [string, 'null']
          maxLength: 500
        deletedAt:
          type: [string, 'null']
          format: date-time
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTransferInput:
      type: object
      required: [sourceAccountId, destinationAccountId, amountMinor, currencyCode]
      properties:
        sourceAccountId: { type: string }
        destinationAccountId: { type: string }
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        occurredAt:
          type: string
          format: date-time
          description: Defaults to now() if omitted. UTC.
        note:
          type: [string, 'null']
          maxLength: 500

    TransferWithPairedTransactions:
      type: object
      required: [transfer, sourceTransaction, destinationTransaction]
      properties:
        transfer: { $ref: '#/components/schemas/Transfer' }
        sourceTransaction: { $ref: '#/components/schemas/Transaction' }
        destinationTransaction: { $ref: '#/components/schemas/Transaction' }

    BillCycle:
      type: string
      enum: [WEEKLY, MONTHLY, QUARTERLY, YEARLY, CUSTOM_DAYS]
      description: |
        Billing cadence. CUSTOM_DAYS requires a positive `customDays` value on
        the owning Bill; every other value MUST have `customDays = null`.

    BillStatus:
      type: string
      enum: [ACTIVE, PAUSED]
      description: |
        ACTIVE bills roll their `nextDueAt` forward and emit due-soon /
        overdue notifications. PAUSED bills retain their state but do not
        advance and do not notify.

    BillPaymentSource:
      type: string
      enum: [MANUAL, AUTO_LOG, BACKFILL]
      description: |
        MANUAL — explicit POST /bills/:id/mark-paid from a client.
        AUTO_LOG — system-recorded when a matching Transaction is detected
        against an auto-log bill.
        BACKFILL — historical import / reconciliation.

    Bill:
      type: object
      required:
        - id
        - householdId
        - name
        - amountMinor
        - currencyCode
        - accountId
        - categoryId
        - cycle
        - customDays
        - startAt
        - nextDueAt
        - endAt
        - status
        - autoLog
        - lastPaidAt
        - note
        - colorToken
        - iconToken
        - displayOrder
        - archivedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, description: ULID. }
        householdId: { type: string }
        name:
          type: string
          minLength: 1
          maxLength: 80
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: |
            Positive minor-units amount in the bill's currency, encoded as a
            decimal string for bigint-safety.
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          description: |
            ISO 4217 uppercase code. Derived from the owning account at create
            time and immutable thereafter.
        accountId: { type: string }
        categoryId:
          type: string
          description: Must reference an EXPENSE-type category.
        cycle: { $ref: '#/components/schemas/BillCycle' }
        customDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
          description: |
            Required when `cycle = CUSTOM_DAYS`. NULL for every other cycle
            value.
        startAt:
          type: string
          format: date-time
          description: First billing instant. UTC.
        nextDueAt:
          type: string
          format: date-time
          description: |
            Next upcoming due instant, advanced on mark-paid and by the
            scheduler. UTC.
        endAt:
          type: [string, 'null']
          format: date-time
          description: Optional end of the recurrence. UTC. Must be ≥ nextDueAt.
        status: { $ref: '#/components/schemas/BillStatus' }
        autoLog:
          type: boolean
          description: |
            When true, matching Transactions on the bill's account may
            auto-log a BillPayment without requiring explicit mark-paid.
        lastPaidAt:
          type: [string, 'null']
          format: date-time
          description: Timestamp of the most recent non-deleted BillPayment. UTC.
        note:
          type: [string, 'null']
          maxLength: 500
        colorToken: { type: [string, 'null'] }
        iconToken: { type: [string, 'null'] }
        displayOrder:
          type: integer
          minimum: 0
          description: Dense 0..N-1 ordering per household.
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: Set when the bill is user-archived; hidden from default lists.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BillPayment:
      type: object
      required:
        - id
        - householdId
        - billId
        - transactionId
        - cycleDueAt
        - paidAt
        - amountMinor
        - source
        - deletedAt
        - createdAt
      properties:
        id: { type: string, description: ULID. }
        householdId: { type: string }
        billId: { type: string }
        transactionId:
          type: [string, 'null']
          description: |
            Backing Transaction ULID. NULL when the payment was recorded
            without (yet) materializing a Transaction.
        cycleDueAt:
          type: string
          format: date-time
          description: The `nextDueAt` value this payment satisfies. UTC.
        paidAt:
          type: string
          format: date-time
          description: Instant the payment was recorded. UTC.
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Positive minor-units amount paid, as a decimal string.
        source: { $ref: '#/components/schemas/BillPaymentSource' }
        deletedAt:
          type: [string, 'null']
          format: date-time
        createdAt: { type: string, format: date-time }

    CreateBillInput:
      type: object
      description: |
        `currencyCode` is deliberately not accepted on input — it is derived
        server-side from the target account at create time. Supplying it is
        silently ignored. `customDays` is required iff `cycle = CUSTOM_DAYS`.
      required: [name, amountMinor, accountId, categoryId, cycle]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Positive minor-units amount as a decimal string.
        accountId: { type: string }
        categoryId: { type: string }
        cycle: { $ref: '#/components/schemas/BillCycle' }
        customDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
        startAt:
          type: string
          format: date-time
          description: Defaults to `now()` if omitted. UTC.
        autoLog: { type: boolean, default: false }
        note:
          type: [string, 'null']
          maxLength: 500
        colorToken: { type: [string, 'null'] }
        iconToken: { type: [string, 'null'] }
        endAt:
          type: [string, 'null']
          format: date-time

    UpdateBillInput:
      type: object
      description: |
        All fields optional. `currencyCode` is immutable (derived from the
        account); sending it returns BILL_CURRENCY_IMMUTABLE (422). Changing
        `accountId` to an account of a different currency returns
        BILL_CURRENCY_MISMATCH (422).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
        accountId: { type: string }
        categoryId: { type: string }
        cycle: { $ref: '#/components/schemas/BillCycle' }
        customDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
        startAt: { type: string, format: date-time }
        autoLog: { type: boolean }
        note:
          type: [string, 'null']
          maxLength: 500
        colorToken: { type: [string, 'null'] }
        iconToken: { type: [string, 'null'] }
        endAt:
          type: [string, 'null']
          format: date-time

    MarkBillPaidInput:
      type: object
      description: |
        All fields optional. When omitted, `amountMinor` defaults to the
        bill's current amount, `occurredAt` defaults to `now()`, and `source`
        defaults to `MANUAL`.
      properties:
        amountMinor:
          type: string
          pattern: '^[1-9][0-9]*$'
        occurredAt:
          type: string
          format: date-time
          description: Instant the payment was made. UTC.
        note:
          type: [string, 'null']
          maxLength: 500
        source: { $ref: '#/components/schemas/BillPaymentSource' }

    MarkBillPaidResponse:
      type: object
      required: [bill, payment, transaction]
      properties:
        bill: { $ref: '#/components/schemas/Bill' }
        payment: { $ref: '#/components/schemas/BillPayment' }
        transaction: { $ref: '#/components/schemas/Transaction' }

    ReorderBillsEntry:
      type: object
      required: [id, displayOrder]
      properties:
        id: { type: string }
        displayOrder:
          type: integer
          minimum: 0

    ReorderBillsInput:
      type: object
      required: [order]
      properties:
        order:
          type: array
          items: { $ref: '#/components/schemas/ReorderBillsEntry' }

    ReorderBillsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Bill' }

    BillsPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Bill' }

    BillsSummaryCurrencyBucket:
      type: object
      required:
        - currencyCode
        - monthlyCostMinor
        - dueSoonMinor
        - activeCount
        - pausedCount
        - dueSoonCount
      properties:
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
        monthlyCostMinor:
          type: string
          description: |
            Monthly-normalized cost across active bills in this currency
            (bigint-safe decimal string).
        dueSoonMinor:
          type: string
          description: |
            Sum of amounts for active bills whose nextDueAt falls within the
            default due-soon window (bigint-safe decimal string).
        activeCount:
          type: integer
          minimum: 0
        pausedCount:
          type: integer
          minimum: 0
        dueSoonCount:
          type: integer
          minimum: 0

    BillsSummaryTotalsAllCurrencies:
      type: object
      required: [activeCount, pausedCount]
      properties:
        activeCount:
          type: integer
          minimum: 0
        pausedCount:
          type: integer
          minimum: 0

    BillsSummaryResponse:
      type: object
      required: [byCurrency, totalsAllCurrencies]
      properties:
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/BillsSummaryCurrencyBucket' }
        totalsAllCurrencies: { $ref: '#/components/schemas/BillsSummaryTotalsAllCurrencies' }

    UpcomingBillItem:
      type: object
      required: [bill, dueAt, daysUntilDue]
      properties:
        bill: { $ref: '#/components/schemas/Bill' }
        dueAt:
          type: string
          format: date-time
          description: Resolved due instant for this occurrence. UTC.
        daysUntilDue:
          type: integer
          description: |
            Whole-day count between `now()` and `dueAt` (UTC). May be 0 for
            today; negative values are not returned by this endpoint.

    BillsUpcomingResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UpcomingBillItem' }

    BillPaymentsPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/BillPayment' }

    BudgetScope:
      type: string
      enum: [HOUSEHOLD, CATEGORY]
      description: |
        HOUSEHOLD budgets apply to every EXPENSE transaction in the
        matching currency; CATEGORY budgets apply only to EXPENSE
        transactions on the referenced category.

    BudgetStatus:
      type: string
      enum: [ACTIVE, PAUSED]

    BudgetPeriod:
      type: string
      enum: [WEEKLY, MONTHLY]

    Budget:
      type: object
      required:
        - id
        - householdId
        - name
        - scope
        - categoryId
        - amountMinor
        - currencyCode
        - period
        - rollover
        - status
        - startAt
        - endAt
        - displayOrder
        - archivedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: ULID.
        householdId:
          type: string
          description: Owning household ULID.
        name:
          type: string
          minLength: 1
          maxLength: 60
        scope: { $ref: '#/components/schemas/BudgetScope' }
        categoryId:
          type: [string, 'null']
          description: |
            Non-null iff scope=CATEGORY; null iff scope=HOUSEHOLD. Service
            layer enforces the coupling.
        amountMinor:
          type: string
          description: |
            Base ceiling in the budget currency's minor units, encoded as a
            decimal string for bigint-safety. Always positive.
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 uppercase code. Immutable after creation.
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        rollover:
          type: boolean
          description: |
            When true, unused ceiling from the previous period is carried
            into the current period (one period back only).
        status: { $ref: '#/components/schemas/BudgetStatus' }
        startAt:
          type: string
          format: date-time
          description: |
            Anchor for period arithmetic. For WEEKLY budgets its UTC
            weekday defines week start; for MONTHLY budgets the period is
            always the calendar month of now(). Immutable after creation.
        endAt:
          type: [string, 'null']
          format: date-time
          description: |
            UTC instant after which the budget stops enforcing. Null means
            open-ended.
        displayOrder:
          type: integer
          minimum: 0
          description: Dense 0..N-1 ordering per household.
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: Set when the budget is user-archived; hidden from default lists.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateBudgetInput:
      type: object
      required: [name, scope, amountMinor, currencyCode, period]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        scope: { $ref: '#/components/schemas/BudgetScope' }
        categoryId:
          type: [string, 'null']
          description: |
            Required when scope=CATEGORY, must be null when scope=HOUSEHOLD
            (enforced by the service with BUDGET_CATEGORY_REQUIRED /
            BUDGET_CATEGORY_FORBIDDEN).
        amountMinor:
          type: string
          description: |
            Base ceiling in the budget currency's minor units, decimal
            string. Must be > 0.
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 uppercase code. Required on create; immutable thereafter.
        period: { $ref: '#/components/schemas/BudgetPeriod' }
        rollover:
          type: boolean
          default: false
        startAt:
          type: string
          format: date-time
          description: |
            Optional. Defaults to now() UTC on the server. Immutable after
            creation.
        endAt:
          type: [string, 'null']
          format: date-time
        displayOrder:
          type: integer
          minimum: 0

    UpdateBudgetInput:
      type: object
      description: |
        Partial update. Only `name`, `amountMinor`, `rollover`, `endAt`,
        and `displayOrder` are mutable. `scope`, `categoryId`,
        `currencyCode`, `period`, and `startAt` are immutable; sending
        them returns the corresponding *_IMMUTABLE error.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        amountMinor:
          type: string
          description: Base ceiling, minor-unit decimal string. Must be > 0.
        rollover:
          type: boolean
        endAt:
          type: [string, 'null']
          format: date-time
        displayOrder:
          type: integer
          minimum: 0

    ReorderBudgetsEntry:
      type: object
      required: [id, displayOrder]
      properties:
        id: { type: string }
        displayOrder:
          type: integer
          minimum: 0

    ReorderBudgetsInput:
      type: object
      required: [order]
      properties:
        order:
          type: array
          items: { $ref: '#/components/schemas/ReorderBudgetsEntry' }

    ReorderBudgetsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Budget' }

    BudgetsPage:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Budget' }

    BudgetsStatusItem:
      type: object
      required:
        - budget
        - periodStart
        - periodEnd
        - effectiveAmountMinor
        - spentMinor
        - remainingMinor
        - progressPercent
        - thresholdsFired
        - rolloverCarryInMinor
        - isOverspent
        - isOverThreshold
      properties:
        budget: { $ref: '#/components/schemas/Budget' }
        periodStart:
          type: string
          format: date-time
          description: UTC instant at the start of the current period (inclusive).
        periodEnd:
          type: string
          format: date-time
          description: UTC instant at the end of the current period (exclusive).
        effectiveAmountMinor:
          type: string
          description: |
            Base ceiling plus rollover carry-in for this period, minor-unit
            decimal string.
        spentMinor:
          type: string
          description: |
            Sum of EXPENSE transaction amounts (excluding transfers) in the
            matching scope for the current period, minor-unit decimal string.
        remainingMinor:
          type: string
          description: |
            Signed `effectiveAmountMinor - spentMinor`. Negative when
            overspent. Minor-unit decimal string.
        progressPercent:
          type: integer
          minimum: 0
          description: |
            `floor(spentMinor * 100 / effectiveAmountMinor)`, non-negative,
            may exceed 100.
        thresholdsFired:
          type: array
          description: |
            Ordered list of threshold percentages already fired for this
            period (subset of [50, 80, 100, 120]).
          items:
            type: integer
        rolloverCarryInMinor:
          type: string
          description: |
            Positive carry-in from the previous period (0 when rollover is
            off or previous period overspent). Minor-unit decimal string.
        isOverspent:
          type: boolean
          description: True when `spentMinor > effectiveAmountMinor`.
        isOverThreshold:
          type: boolean
          description: True when any fired threshold is >= 100.

    BudgetsStatusResponse:
      type: object
      required: [asOf, items]
      properties:
        asOf:
          type: string
          format: date-time
          description: UTC instant at which the status was computed.
        items:
          type: array
          items: { $ref: '#/components/schemas/BudgetsStatusItem' }

    BudgetSuggestion:
      type: object
      required:
        - categoryId
        - categoryName
        - suggestedAmountMinor
        - currencyCode
      properties:
        categoryId: { type: string }
        categoryName: { type: string }
        suggestedAmountMinor:
          type: string
          description: |
            Trailing 30-day spend scaled up by 10% and rounded up to the
            next 1000 minor units. Minor-unit decimal string.
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3

    BudgetSuggestionsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BudgetSuggestion' }

    BudgetHistoryPeriod:
      type: object
      required:
        - periodStart
        - periodEnd
        - effectiveAmountMinor
        - spentMinor
        - remainingMinor
        - isOverspent
        - thresholdsFired
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
          description: Exclusive upper bound of the period (UTC).
        effectiveAmountMinor:
          type: string
          description: Base ceiling + rollover carry-in for that period.
        spentMinor:
          type: string
        remainingMinor:
          type: string
          description: Signed `effectiveAmountMinor - spentMinor`.
        isOverspent:
          type: boolean
        thresholdsFired:
          type: array
          items:
            type: integer

    BudgetHistoryResponse:
      type: object
      required: [budgetId, periods]
      properties:
        budgetId:
          type: string
        periods:
          type: array
          description: Periods ordered newest-first.
          items: { $ref: '#/components/schemas/BudgetHistoryPeriod' }

    StatsPeriodKind:
      type: string
      enum: [week, month, year, custom]
      description: |
        Window selector for Stats endpoints. `week|month|year` resolve to the
        containing UTC calendar window; `custom` requires `from`+`to`.

    StatsPeriodRange:
      type: object
      required: [kind, from, to]
      properties:
        kind: { $ref: '#/components/schemas/StatsPeriodKind' }
        from:
          type: string
          format: date-time
          description: Inclusive start of the window, UTC.
        to:
          type: string
          format: date-time
          description: Exclusive end of the window, UTC.

    PeriodDeltaState:
      type: string
      enum: [has_previous, no_previous_data, zero_to_positive, zero_to_negative]
      description: |
        Disambiguates the meaning of `deltaPercent` null-vs-number cases.
        `has_previous` — previous > 0, `deltaPercent` is a signed integer.
        `no_previous_data` — both current and previous are 0, `deltaPercent` is null.
        `zero_to_positive` — previous = 0, current > 0, `deltaPercent` is null.
        `zero_to_negative` — previous = 0, current < 0, `deltaPercent` is null.

    StatsOverviewCurrencyBucket:
      type: object
      required:
        - currencyCode
        - incomeMinor
        - expenseMinor
        - netMinor
        - transactionCount
        - previousIncomeMinor
        - previousExpenseMinor
        - previousNetMinor
        - incomeDeltaPercent
        - expenseDeltaPercent
        - netDeltaPercent
        - deltaState
      properties:
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        incomeMinor:
          type: string
          description: Current-period income total in minor units (bigint as decimal string).
        expenseMinor:
          type: string
          description: Current-period expense total in minor units (bigint as decimal string).
        netMinor:
          type: string
          description: income - expense, minor units.
        transactionCount:
          type: integer
          minimum: 0
        previousIncomeMinor: { type: string }
        previousExpenseMinor: { type: string }
        previousNetMinor: { type: string }
        incomeDeltaPercent:
          type: [integer, 'null']
          description: Signed floor percent delta vs previous period. Null when `deltaState != has_previous`.
        expenseDeltaPercent:
          type: [integer, 'null']
        netDeltaPercent:
          type: [integer, 'null']
        deltaState:
          $ref: '#/components/schemas/PeriodDeltaState'

    StatsOverviewTopCategoryItem:
      type: object
      required:
        - categoryId
        - categoryKey
        - label
        - iconToken
        - currencyCode
        - amountMinor
        - transactionCount
        - percentOfTotal
      properties:
        categoryId: { type: string }
        categoryKey: { type: string }
        label: { type: string }
        iconToken: { type: string }
        colorToken:
          type: [string, 'null']
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        amountMinor:
          type: string
          description: Category total in minor units (bigint as decimal string).
        transactionCount:
          type: integer
          minimum: 0
        percentOfTotal:
          type: integer
          minimum: 0
          maximum: 100

    StatsOverviewResponse:
      type: object
      required: [period, previousPeriod, byCurrency, topCategories]
      properties:
        period: { $ref: '#/components/schemas/StatsPeriodRange' }
        previousPeriod: { $ref: '#/components/schemas/StatsPeriodRange' }
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/StatsOverviewCurrencyBucket' }
        topCategories:
          type: array
          description: EXPENSE-only, primary-currency scope, sorted by `amountMinor` DESC, capped at `topCategoriesLimit`.
          items: { $ref: '#/components/schemas/StatsOverviewTopCategoryItem' }

    MonthlyTrendPoint:
      type: object
      required: [month, incomeMinor, expenseMinor]
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: Calendar month bucket as `YYYY-MM` (UTC).
        incomeMinor: { type: string }
        expenseMinor: { type: string }

    MonthlyTrendCurrencySeries:
      type: object
      required: [currencyCode, points]
      properties:
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        points:
          type: array
          description: Exactly `months` points, oldest→newest.
          items: { $ref: '#/components/schemas/MonthlyTrendPoint' }

    MonthlyTrendResponse:
      type: object
      required: [series]
      properties:
        series:
          type: array
          items: { $ref: '#/components/schemas/MonthlyTrendCurrencySeries' }

    CategoryBreakdownItem:
      type: object
      required: [categoryId, label, amountMinor, transactionCount, percentOfTotal]
      properties:
        categoryId: { type: string }
        label: { type: string }
        iconToken:
          type: [string, 'null']
        colorToken:
          type: [string, 'null']
        amountMinor: { type: string }
        transactionCount:
          type: integer
          minimum: 0
        percentOfTotal:
          type: integer
          minimum: 0
          maximum: 100

    CategoryBreakdownCurrencyBucket:
      type: object
      required: [currencyCode, totalMinor, items]
      properties:
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        totalMinor: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CategoryBreakdownItem' }

    CategoryBreakdownResponse:
      type: object
      required: [period, type, byCurrency]
      properties:
        period: { $ref: '#/components/schemas/StatsPeriodRange' }
        type:
          allOf:
            - { $ref: '#/components/schemas/TransactionType' }
          description: Echoes the `type` query argument. The service rejects TRANSFER; INCOME or EXPENSE only in practice.
        byCurrency:
          type: array
          items: { $ref: '#/components/schemas/CategoryBreakdownCurrencyBucket' }

    DailySpendPoint:
      type: object
      required: [date, amountMinor, transactionCount]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: UTC calendar day as `YYYY-MM-DD`.
        amountMinor: { type: string }
        transactionCount:
          type: integer
          minimum: 0

    DailySpendCurrencySeries:
      type: object
      required: [currencyCode, intensityCapMinor, points]
      properties:
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        intensityCapMinor:
          type: string
          description: 99th-percentile daily amount in the window (or max daily amount when fewer than 10 non-zero days). Client uses it as the heatmap intensity anchor.
        points:
          type: array
          description: Exactly `days` points, oldest→newest.
          items: { $ref: '#/components/schemas/DailySpendPoint' }

    DailySpendResponse:
      type: object
      required: [series]
      properties:
        series:
          type: array
          items: { $ref: '#/components/schemas/DailySpendCurrencySeries' }

    CategorySparklinePoint:
      type: object
      required: [date, amountMinor]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        amountMinor: { type: string }

    CategorySparklineItem:
      type: object
      required: [categoryId, currencyCode, points]
      properties:
        categoryId: { type: string }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        points:
          type: array
          description: Exactly `days` points, oldest→newest.
          items: { $ref: '#/components/schemas/CategorySparklinePoint' }

    CategorySparklineResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Items echo the input order of the `categoryIds` query param.
          items: { $ref: '#/components/schemas/CategorySparklineItem' }

    SankeyNodeKind:
      type: string
      enum: [income, expense, savings, transfer_out]

    SankeyNode:
      type: object
      required: [id, kind, label]
      properties:
        id:
          type: string
          description: Stable node identifier within this response (e.g. `income:<categoryId>`, `expense:<categoryId>`, `savings`, `transfer_out`).
        kind: { $ref: '#/components/schemas/SankeyNodeKind' }
        label: { type: string }
        colorToken:
          type: [string, 'null']

    SankeyLink:
      type: object
      required: [source, target, amountMinor]
      properties:
        source:
          type: string
          description: Source node id.
        target:
          type: string
          description: Target node id.
        amountMinor:
          type: string
          description: Link weight in minor units (bigint as decimal string).

    SankeyResponse:
      type: object
      required: [period, currencyCode, nodes, links]
      properties:
        period: { $ref: '#/components/schemas/StatsPeriodRange' }
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          description: The single currency this Sankey response represents.
        nodes:
          type: array
          items: { $ref: '#/components/schemas/SankeyNode' }
        links:
          type: array
          items: { $ref: '#/components/schemas/SankeyLink' }

security:
  - BearerAuth: []

tags:
  - name: meta
    description: Service metadata and liveness probes.
  - name: auth
    description: Email+OTP authentication, refresh, and session revocation.
  - name: me
    description: Endpoints scoped to the authenticated user (profile, push tokens).
  - name: households
    description: Household tenants, members, and invites.
  - name: accounts
    description: Financial accounts owned by a household.
  - name: categories
    description: System-default and household-custom categories for transactions.
  - name: transactions
    description: Money-movement rows scoped to a household account.
  - name: transfers
    description: Atomic paired-write money movement between two household accounts.
  - name: bills
    description: Recurring bills and subscriptions with scheduled due dates and payment history.
  - name: budgets
    description: Household-wide and per-category spending ceilings with threshold notifications and per-period rollover.
  - name: notifications
    description: Per-user notification surfaces (unread counts, list, mark-read).
  - name: stats
    description: Read-only aggregate analytics over transactions (overview, trends, category breakdown, daily spend, sparklines, Sankey flow).
