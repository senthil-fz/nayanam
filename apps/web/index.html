<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nayanam</title>

    <!--
      Content-Security-Policy (meta FALLBACK only — limited effectiveness).

      IMPORTANT: The authoritative CSP is set as an HTTP response header by the
      Vite plugin in vite.config.ts (dev/preview) and MUST be mirrored at the
      edge/CDN in production with the correct VITE_API_URL injected into connect-src.

      Limitations of this <meta> tag:
        1. frame-ancestors is silently ignored — X-Frame-Options / the HTTP header
           CSP are the only effective clickjacking protection.
        2. connect-src here is a local-dev fallback; production needs the real API origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://localhost:3000; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https:; img-src 'self' data: blob:; object-src 'none'; base-uri 'self';"
    />
    <!-- Referrer policy: send origin only on same-origin, full URL on same-site. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
